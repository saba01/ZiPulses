name: Compilar ZiPulses

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar codi
        uses: actions/checkout@v4

      - name: Instal·lar compilador ARM i eines
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3

      - name: Compatibilitat majuscules/minuscules Windows-Linux
        run: |
          find . -type f -name "*.h" -exec bash -c '
            for f; do
              dir=$(dirname "$f")
              base=$(basename "$f")
              lower=$(echo "$base" | tr "[:upper:]" "[:lower:]")
              if [ "$base" != "$lower" ] && [ ! -e "$dir/$lower" ]; then
                ln -s "$base" "$dir/$lower"
              fi
            done
          ' bash {} +

      - name: Compilar firmware JN5189
        working-directory: PulsesSensor/Build/mcux
        run: |
          make TOOLCHAIN_DIR_PATH=/usr TOOLCHAIN_PATH=/usr/bin APP_NTAG_ICODE=0 JENNIC_CHIP=JN5189 DR=OM15082 all

      - name: Pujar fitxer .bin compilat
        uses: actions/upload-artifact@v4
        with:
          name: ZiPulses-Personalitzat-v12.2
          path: Binaries/**/*.bin
