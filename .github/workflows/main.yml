name: Compilar ZiPulses

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar codi
        uses: actions/checkout@v4

      - name: Instal·lar compilador ARM, eines i Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3 wine wine32:i386

      - name: Compatibilitat Windows-Linux (capçaleres i eines Zigbee)
        run: |
          find . -type f -name "*.h" -exec bash -c '
            for f; do
              dir=$(dirname "$f")
              base=$(basename "$f")
              lower=$(echo "$base" | tr "[:upper:]" "[:lower:]")
              if [ "$base" != "$lower" ] && [ ! -e "$dir/$lower" ]; then
                ln -s "$base" "$dir/$lower"
              fi
            done
          ' bash {} +
          find . -iname "pwr_interface.h" -exec cp {} PulsesSensor/Source/PWR_interface.h \;

          TOOLS_DIR="PulsesSensor/SDK_2_6_4_JN5189DK6/middleware/wireless/zigbee/tools"
          mkdir -p "$TOOLS_DIR/PDUMConfig/linuxbin" "$TOOLS_DIR/ZPSConfig/linuxbin"
          printf '#!/bin/bash\nwine "$(dirname "$0")/../winbin/PDUMConfig.exe" "$@"\n' > "$TOOLS_DIR/PDUMConfig/linuxbin/PDUMConfig"
          printf '#!/bin/bash\nwine "$(dirname "$0")/../winbin/ZPSConfig.exe" "$@"\n' > "$TOOLS_DIR/ZPSConfig/linuxbin/ZPSConfig"
          chmod +x "$TOOLS_DIR/PDUMConfig/linuxbin/PDUMConfig" "$TOOLS_DIR/ZPSConfig/linuxbin/ZPSConfig"

      - name: Compilar firmware JN5189
        working-directory: PulsesSensor/Build/mcux
        run: |
          make TOOLCHAIN_DIR_PATH=/usr TOOLCHAIN_PATH=/usr/bin APP_NTAG_ICODE=0 JENNIC_CHIP=JN5189 DR=OM15082 all

      - name: Pujar fitxer .bin compilat
        uses: actions/upload-artifact@v4
        with:
          name: ZiPulses-12.2-ExtPower
          path: Binaries/**/*.bin
