name: Compilar ZiPulses

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar codi
        uses: actions/checkout@v4

      - name: Instal·lar compilador ARM i eines
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3

      - name: Compatibilitat Windows-Linux i preservació de taules Zigbee
        run: |
          find . -type f -name "*.h" -exec bash -c '
            for f; do
              dir=$(dirname "$f")
              base=$(basename "$f")
              lower=$(echo "$base" | tr "[:upper:]" "[:lower:]")
              if [ "$base" != "$lower" ] && [ ! -e "$dir/$lower" ]; then
                ln -s "$base" "$dir/$lower"
              fi
            done
          ' bash {} +
          find . -iname "pwr_interface.h" -exec cp {} PulsesSensor/Source/PWR_interface.h \;

          mkdir -p /tmp/zps_backup
          cp PulsesSensor/Source/pdum_gen.* PulsesSensor/Source/zps_gen*.* PulsesSensor/Source/pdum_apdu.* /tmp/zps_backup/ || true

          TOOLS_DIR="PulsesSensor/SDK_2_6_4_JN5189DK6/middleware/wireless/zigbee/tools"
          mkdir -p "$TOOLS_DIR/PDUMConfig/linuxbin" "$TOOLS_DIR/ZPSConfig/linuxbin"
          printf '#!/bin/bash\ncp /tmp/zps_backup/pdum_gen.* /tmp/zps_backup/pdum_apdu.* ../../../PulsesSensor/Source/ 2>/dev/null || true\n' > "$TOOLS_DIR/PDUMConfig/linuxbin/PDUMConfig"
          printf '#!/bin/bash\ncp /tmp/zps_backup/zps_gen*.* ../../../PulsesSensor/Source/ 2>/dev/null || true\n' > "$TOOLS_DIR/ZPSConfig/linuxbin/ZPSConfig"
          chmod +x "$TOOLS_DIR/PDUMConfig/linuxbin/PDUMConfig" "$TOOLS_DIR/ZPSConfig/linuxbin/ZPSConfig"

      - name: Compilar firmware JN5189
        working-directory: PulsesSensor/Build/mcux
        run: |
          make TOOLCHAIN_DIR_PATH=/usr TOOLCHAIN_PATH=/usr/bin APP_NTAG_ICODE=0 JENNIC_CHIP=JN5189 DR=OM15082 all

      - name: Pujar fitxer .bin compilat
        uses: actions/upload-artifact@v4
        with:
          name: ZiPulses-12.2-ExtPower
          path: Binaries/**/*.bin
